name: Android CI

on:
  push:
    branches: [main, 'codex/**', 'codex/build-stabilization']
  pull_request:
    branches: [main, 'codex/**', 'codex/build-stabilization']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android app (JDK 17 / API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          sdkmanager_status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$sdkmanager_status"

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # gradle/actions v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # gradle/actions v4

      - name: Verify wrapper runtime
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew --version --console=plain 2>&1 | tee ci-logs/gradle-version.log

      - name: Run KSP schema generation
        run: |
          set -o pipefail
          ./gradlew :app:kspDebugKotlin --stacktrace --console=plain 2>&1 | tee ci-logs/ksp.log

      - name: Compile Kotlin
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --stacktrace --console=plain 2>&1 | tee ci-logs/kotlin-compile.log

      - name: Compile Android test sources
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugAndroidTestKotlin --stacktrace --console=plain 2>&1 | tee ci-logs/android-test-compile.log

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee ci-logs/unit-tests.log

      - name: Run Android lint
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --stacktrace --console=plain 2>&1 | tee ci-logs/lint.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --console=plain 2>&1 | tee ci-logs/debug-apk.log

      - name: Build parallel-install device verification APK
        run: ./gradlew :app:assembleDeviceTest --stacktrace

      - name: Verify debug APK archive and signature
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee ci-logs/test-summary.txt
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/**/*.xml', recursive=True)
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for file in files:
              try:
                  root = ET.parse(file).getroot()
              except (ET.ParseError, OSError):
                  continue
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, 0))
          print(f"JUnit XML files: {len(files)}")
          for key, value in totals.items():
              print(f"{key}: {value}")
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cosmic-ai-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          # APKs are already compressed ZIPs; avoid a second DEFLATE layer and
          # reduce corruption/parser issues in third-party artifact downloaders.
          compression-level: 0

      - name: Upload device verification APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cosmic-codex-device-test-apk-${{ github.sha }}
          path: app/build/outputs/apk/deviceTest/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cosmic-codex-test-reports-${{ github.sha }}
          path: app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cosmic-codex-lint-reports-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Gradle build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cosmic-codex-build-logs-${{ github.sha }}
          path: ci-logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build and Room schema reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cosmic-codex-build-reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/schemas/**
          if-no-files-found: warn
          retention-days: 14
