name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build-tools
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Parse tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CODE=$(python3 - <<'PY'
          import os, re
          v = os.environ.get("GITHUB_REF_NAME", "v0.0.0").lstrip("v")
          parts = [int(x) for x in re.findall(r"\d+", v)]
          while len(parts) < 3:
              parts.append(0)
          print(parts[0] * 100 + parts[1] * 10 + parts[2])
          PY
          )
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Locate APK and checksum
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "No APK"; exit 1; fi
          cp "$APK" "cosmic-ai-v${{ steps.ver.outputs.version }}.apk"
          SHA=$(sha256sum "cosmic-ai-v${{ steps.ver.outputs.version }}.apk" | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  cosmic-ai-v${{ steps.ver.outputs.version }}.apk" > SHA256SUMS.txt
          cat > release.json <<JSON
          {
            "app_id": "com.cosmic.ai",
            "version": "${{ steps.ver.outputs.version }}",
            "version_code": ${{ steps.ver.outputs.code }},
            "minimum_supported_version_code": 1,
            "mandatory": false,
            "channel": "stable",
            "apk_asset": "cosmic-ai-v${{ steps.ver.outputs.version }}.apk",
            "sha256": "$SHA",
            "release_notes": ["Automated release from tag ${{ github.ref_name }}"]
          }
          JSON

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: COSMIC AI v${{ steps.ver.outputs.version }}
          body: |
            version_code: ${{ steps.ver.outputs.code }}
            minimum_supported_version_code: 1
            mandatory: false
            sha256: ${{ steps.apk.outputs.sha }}

            Automated stable channel release.
          files: |
            cosmic-ai-v${{ steps.ver.outputs.version }}.apk
            release.json
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
